server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: javastudy
  profiles:
    default: local
  
  datasource:
    url: jdbc:h2:file:./data/javastudy;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: 
  
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect
  
  h2:
    console:
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

# JWT Configuration
jwt:
  secret: ${JWT_SECRET}
  expiration: 2592000000  # 30 days in milliseconds
  refresh-expiration: 604800000  # 7 days

# Sandbox Configuration
sandbox:
  docker-image: eclipse-temurin:21-jdk-alpine
  timeout-seconds: 3
  memory-limit-mb: 256
  cpu-limit: 0.5
  # Local JavaCompiler fallback is the default. Set SANDBOX_USE_DOCKER=true when Docker is available.
  use-docker: ${SANDBOX_USE_DOCKER:false}
  # Never enable this in a public environment. Local execution is only for development.
  allow-local-fallback: ${SANDBOX_ALLOW_LOCAL_FALLBACK:true}

# Rate Limiting
ratelimit:
  login:
    requests: 5
    duration-minutes: 1

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,https://1victorx.github.io}
  execute:
    requests: 30
    duration-minutes: 1

# Logging
logging:
  level:
    com.javastudy: INFO
    org.springframework.security: WARN
    org.hibernate.SQL: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n"
