services:
  - type: web
    name: javastudy-api
    runtime: docker
    plan: free
    dockerfilePath: ./docker/Dockerfile.backend
    dockerContext: .
    healthCheckPath: /api/exercises?page=0&size=1
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: JWT_SECRET
        generateValue: true
      - key: SANDBOX_USE_DOCKER
        value: "false"
      - key: SANDBOX_ALLOW_LOCAL_FALLBACK
        value: "false"
      - key: H2_CONSOLE_ENABLED
        value: "false"
      - key: CORS_ALLOWED_ORIGINS
        value: https://1victorx.github.io
